services:
  ccfwp-platform:
    build: .
    image: ccfwp-platform:dev
    container_name: ccfwp-platform
    ports:
      - "8001:8001"
    volumes:
      - ./:/app
      - /app/manager/node_modules
      - /app/manager/client/node_modules
      # Persistent data for manager and user projects
      - ./.platform-data:/app/.platform-data
      # Only the manager-side Runtime Broker receives Docker Engine access.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=development
      # Manager Service Internal Port (Default: 3000)
      # This is the port the express server listens on inside the container.
      - MANAGER_SERVICE_PORT=8001
      - RUNTIME_PROVIDER=docker
      - BUILD_NETWORK_MODE=${BUILD_NETWORK_MODE:-prefer-offline}
      - BUILD_REGISTRY_ALLOWLIST=${BUILD_REGISTRY_ALLOWLIST:-https://registry.npmmirror.com/,https://registry.npmjs.org/}
      - BUILD_DEFAULT_REGISTRY=${BUILD_DEFAULT_REGISTRY:-https://registry.npmmirror.com/}
      - PROJECT_RUNTIME_IMAGE=ccfwp-platform:dev
      - MANAGER_CONTAINER_ID=ccfwp-platform
      - PLATFORM_DATA_HOST_DIR=${PWD}/.platform-data

    # Dockerfile ends in /app/manager; reset to the repository root because
    # the development command below addresses manager/ explicitly.
    working_dir: /app

    # Recreate dependencies from the lockfiles because bind mounts hide the
    # image's node_modules; prefer the local npm cache for repeatable startups.
    command: sh -c "cd manager && npm ci --prefer-offline --no-audit --no-fund && cd client && npm ci --prefer-offline --no-audit --no-fund && npm run build && cd .. && node server.js"
    restart: unless-stopped
