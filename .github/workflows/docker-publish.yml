name: Publish Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker Hub tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ccfwp-platform
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve immutable image tag
        id: tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -n "$DISPATCH_TAG" ]]; then
            image_tag="$DISPATCH_TAG"
          else
            image_tag="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $image_tag" >&2
            exit 1
          fi
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Build and push amd64/arm64 images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
