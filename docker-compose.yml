x-platform-image: &platform-image "${CCFWP_IMAGE_REPOSITORY:?Set CCFWP_IMAGE_REPOSITORY}:${CCFWP_IMAGE_TAG:?Set CCFWP_IMAGE_TAG (strict vX.Y.Z)}"

# This file is also the paste-ready 1Panel deployment manifest. It intentionally
# has no build context or source-tree mounts: all services use one immutable image.
services:
  ccfwp:
    image: *platform-image
    pull_policy: always
    command: ["node", "/app/updater/entrypoint.js"]
    container_name: ccfwp-container
    expose:
      - "8001"
    volumes:
      # 持久化数据卷
      - ${CCFWP_DATA_DIR:-/opt/1panel/apps/ccfwp/data}:/app/.platform-data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: production
      PLATFORM_DATA_DIR: /app/.platform-data
      CCFWP_APP_RELEASE_ROOT: /app/.platform-data/app-releases
      CCFWP_UPDATER_URL: http://ccfwp-updater:8002
      CCFWP_UPDATER_TOKEN: ${CCFWP_UPDATER_TOKEN:?Set CCFWP_UPDATER_TOKEN in .env}
      MANAGER_SERVICE_PORT: 8001
      RUNTIME_PROVIDER: docker
      BUILD_NETWORK_MODE: ${BUILD_NETWORK_MODE:-prefer-offline}
      BUILD_REGISTRY_ALLOWLIST: ${BUILD_REGISTRY_ALLOWLIST:-https://registry.npmmirror.com/,https://registry.npmjs.org/}
      BUILD_DEFAULT_REGISTRY: ${BUILD_DEFAULT_REGISTRY:-https://registry.npmmirror.com/}
      PROJECT_RUNTIME_IMAGE: *platform-image
      MANAGER_CONTAINER_ID: ccfwp-container
      PLATFORM_DATA_HOST_DIR: ${CCFWP_DATA_DIR:-/opt/1panel/apps/ccfwp/data}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in .env}
      INGRESS_PROXY_TOKEN: ${INGRESS_PROXY_TOKEN:?Set INGRESS_PROXY_TOKEN in .env}
      CONSOLE_HOSTS: ${CONSOLE_HOST:?Set CONSOLE_HOST in .env}
      PROJECTS_BASE_DOMAIN: ${PROJECTS_BASE_DOMAIN:?Set PROJECTS_BASE_DOMAIN in .env}
      TRUST_PROXY: linklocal,uniquelocal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/api/health',{headers:{host:process.env.CONSOLE_HOSTS}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

    depends_on:
      ccfwp-updater:
        condition: service_healthy

    restart: unless-stopped

  ccfwp-updater:
    image: *platform-image
    pull_policy: always
    container_name: ccfwp-updater
    command: ["node", "/app/updater/server.js"]
    expose:
      - "8002"
    volumes:
      - ${CCFWP_DATA_DIR:-/opt/1panel/apps/ccfwp/data}:/app/.platform-data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: production
      PLATFORM_DATA_DIR: /app/.platform-data
      CCFWP_APP_RELEASE_ROOT: /app/.platform-data/app-releases
      CCFWP_GITHUB_REPOSITORY: ${CCFWP_GITHUB_REPOSITORY:-}
      CCFWP_RELEASE_SIGNER_ISSUER: ${CCFWP_RELEASE_SIGNER_ISSUER:-https://token.actions.githubusercontent.com}
      CCFWP_RELEASE_RETENTION: ${CCFWP_RELEASE_RETENTION:-3}
      CCFWP_MAX_RELEASE_BYTES: ${CCFWP_MAX_RELEASE_BYTES:-2147483648}
      CCFWP_UPDATER_TOKEN: ${CCFWP_UPDATER_TOKEN:?Set CCFWP_UPDATER_TOKEN in .env}
      MANAGER_CONTAINER_ID: ccfwp-container
      UPDATER_PORT: 8002
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  caddy:
    image: *platform-image
    pull_policy: always
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in .env}
      CONSOLE_HOST: ${CONSOLE_HOST:?Set CONSOLE_HOST in .env}
      PROJECTS_BASE_DOMAIN: ${PROJECTS_BASE_DOMAIN:?Set PROJECTS_BASE_DOMAIN in .env}
      INGRESS_PROXY_TOKEN: ${INGRESS_PROXY_TOKEN:?Set INGRESS_PROXY_TOKEN in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ccfwp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
