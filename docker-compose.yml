services:
  ccfwp:
    build: .
    image: ccfwp:latest
    container_name: ccfwp-container
    ports:
      - "8001:8001"
      - "9100:9100"
    volumes:
      # 持久化数据卷
      - ./.platform-data:/app/.platform-data
    environment:
      - NODE_ENV=production
      # 管理后台内部端口
      - MANAGER_SERVICE_PORT=8001
      - R2_ADMIN_PORT=9100

    restart: unless-stopped
